[package]
name = "gloria-pack"
description = "Builds <Name>_<version>_x64-setup.exe from the GloriaSetup stub, an app folder and gloria.toml."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "gloria-pack"
path = "src/main.rs"

[dependencies]
gloria-core = { path = "../gloria-core" }
serde_json.workspace = true
toml.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_System_LibraryLoader"]

[build-dependencies]
gloria-core = { path = "../gloria-core" }

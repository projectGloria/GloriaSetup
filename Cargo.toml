[workspace]
resolver = "2"
members = ["crates/gloria-core", "crates/gloria-stub", "crates/gloria-pack", "examples/dummy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", default-features = false }
windows = "0.62.2"
windows-core = "0.62"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

name: Release

# Builds and publishes a GitHub Release + npm (`gloria-setup`) for the version in Cargo.toml.
# Runs only when started on purpose (`gh workflow run release.yml`, or /monjita-github-release);
# pushing to main never releases. Fails if that version is already released.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without publishing a GitHub Release or npm package
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check version change and manifest sync
        id: check
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read version from Cargo.toml"
            exit 1
          fi
          NPM_VERSION="$(node -p "require('./npm/package.json').version")"
          if [[ "$NPM_VERSION" != "$VERSION" ]]; then
            echo "::error::npm/package.json version ($NPM_VERSION) does not match Cargo.toml ($VERSION)"
            exit 1
          fi
          PIN="$(sed -n "s/^  GLORIA_SETUP_PIN: '\([^']*\)'/\1/p" .github/workflows/app-check.yml | head -n 1)"
          if [[ "$PIN" != "$VERSION" ]]; then
            echo "::error::.github/workflows/app-check.yml GLORIA_SETUP_PIN ($PIN) does not match Cargo.toml ($VERSION)"
            exit 1
          fi
          README_TAG="$(sed -n 's#.*projectGloria/GloriaSetup@\(v[^[:space:]]*\).*#\1#p' README.md | head -n 1)"
          if [[ "$README_TAG" != "v$VERSION" ]]; then
            echo "::error::README.md uses projectGloria/GloriaSetup@$README_TAG but the version is v$VERSION; update the README example"
            exit 1
          fi

          TAG="v$VERSION"
          TAG_EXISTS="false"
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]]; then
            TAG_EXISTS="true"
          fi

          BUILD="true"
          if [[ "$TAG_EXISTS" == "true" && "$DRY_RUN" != "true" ]]; then
            echo "::error::$TAG is already released. Bump the version in Cargo.toml, npm/package.json and README.md first."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Detected version=$VERSION tag_exists=$TAG_EXISTS dry_run=$DRY_RUN"

  build:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Test
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --release --locked -p gloria-stub -p gloria-pack
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $mb = (Get-Item target\release\gloria-stub.exe).Length / 1MB
          "gloria-stub.exe: {0:N2} MB" -f $mb
          if ($mb -ge 5) { throw ("gloria-stub.exe is {0:N2} MB (must be < 5 MB)" -f $mb) }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target\release\gloria-pack.exe, target\release\gloria-stub.exe out\

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gloria-setup-bin
          compression-level: 0
          path: |
            out/gloria-pack.exe
            out/gloria-stub.exe

  publish:
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gloria-setup-bin
          path: dist

      - name: Generate checksums and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh needs the repository named explicitly.
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum gloria-pack.exe gloria-stub.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)

          # Reuse a draft left behind by a failed run instead of creating a duplicate;
          # refuse to overwrite a release that is already published.
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [[ "$IS_DRAFT" == "false" ]]; then
            echo "::error::Release $TAG is already published; bump the version to release again."
            exit 1
          elif [[ "$IS_DRAFT" == "true" ]]; then
            echo "Reusing existing draft release $TAG"
          else
            CREATE_ARGS=(release create "$TAG" --draft --target "$TARGET_SHA" --title "GloriaSetup $TAG" --generate-notes)
            if [[ "$VERSION" == *-* ]]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh "${CREATE_ARGS[@]}"
          fi

          gh release upload "$TAG" dist/gloria-pack.exe dist/gloria-stub.exe dist/SHA256SUMS.txt --clobber

          mkdir -p verify
          gh release download "$TAG" --dir verify --clobber
          (cd verify && sha256sum --check SHA256SUMS.txt)

          gh release edit "$TAG" --draft=false

  publish-npm:
    needs: [version, publish]
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gloria-setup-bin
          path: npm/bin

      - name: Verify npm package
        shell: pwsh
        working-directory: npm
        run: npm test

      - name: Check whether this version is already on npm
        id: npm
        shell: bash
        working-directory: npm
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if npm view "gloria-setup@$VERSION" version >/dev/null 2>&1; then
            echo "gloria-setup@$VERSION is already published; skipping npm publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: ${{ steps.npm.outputs.published != 'true' && !contains(needs.version.outputs.version, '-') }}
        shell: bash
        working-directory: npm
        run: npm publish --access public

      - name: Publish prerelease to npm
        if: ${{ steps.npm.outputs.published != 'true' && contains(needs.version.outputs.version, '-') }}
        shell: bash
        working-directory: npm
        run: npm publish --access public --tag next

  # Apps call the shared workflows at @v<major> (templates/release.yml). Move that tag only now, after the tests,
  # the GitHub Release and npm all succeeded, so apps never run an unreleased GloriaSetup.
  move-major-tag:
    needs: [version, publish-npm]
    if: github.ref == 'refs/heads/main' && !inputs.dry_run && !contains(needs.version.outputs.version, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Move v<major> to this release
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          MAJOR="v${VERSION%%.*}"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
          echo "$MAJOR -> $GITHUB_SHA (v$VERSION)"

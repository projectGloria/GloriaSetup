# Reusable: the last job of every projectGloria app release.
# Takes the files the app's own build job uploaded and:
#   - installer apps (gloria.toml): checks that main_exe's FileDescription and ProductName are the app name, packs
#     with the gloria-setup version app-check picked, bundles the WebView2 bootstrapper when needs_webview2 = true,
#     and dry-runs the setup
#   - other apps (browser extensions, Android, ...): publishes the uploaded files as they are
# then publishes GitHub Release v<version> with SHA256SUMS.txt (draft -> upload -> verify -> undraft).
#
# Usage (in the app's .github/workflows/release.yml):
#   release:
#     needs: [check, build]
#     uses: projectGloria/GloriaSetup/.github/workflows/app-release.yml@v0
#     permissions:
#       contents: write
#     with:
#       version: ${{ needs.check.outputs.version }}
#       installer: ${{ needs.check.outputs.installer == 'true' }}
#       gloria_setup: ${{ needs.check.outputs.gloria_setup }}
#       dry_run: ${{ inputs.dry_run }}
name: App release

on:
  workflow_call:
    inputs:
      version:
        description: Version to release (from app-check)
        type: string
        required: true
      installer:
        description: Pack a GloriaSetup installer (true) or publish the uploaded files as-is (false)
        type: boolean
        required: true
      gloria_setup:
        description: gloria-setup version to pack with (from app-check)
        type: string
        default: ''
      artifact:
        description: Name of the artifact the build job uploaded (the staged app folder, or the files to publish)
        type: string
        default: app
      dry_run:
        description: Build and verify everything, but do not publish
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    if: inputs.installer
    runs-on: windows-latest
    steps:
      # gloria.toml and the icon it points to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact }}
          path: stage

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: The app's exe is named like the app
        shell: pwsh
        run: |
          # Task Manager, the taskbar, Volume Mixer and "Open with" show the exe's FileDescription, not gloria.toml.
          $top = @{}
          foreach ($line in Get-Content gloria.toml) {
            if ($line -match '^\s*\[') { break }
            if ($line -match '^\s*(name|main_exe)\s*=\s*"([^"]*)"') { $top[$Matches[1]] = $Matches[2] }
          }
          $exe = Join-Path stage $top['main_exe']
          if (-not (Test-Path $exe)) { "::error::main_exe '$($top['main_exe'])' is not in the uploaded app folder (stage/)"; exit 1 }
          $vi = (Get-Item $exe).VersionInfo
          "FileDescription: '$($vi.FileDescription)'  ProductName: '$($vi.ProductName)'  expected: '$($top['name'])'"
          $fail = $false
          foreach ($k in 'FileDescription', 'ProductName') {
            if ($vi.$k -cne $top['name']) {
              "::error::$($top['main_exe']) has $k '$($vi.$k)' but it must be exactly '$($top['name'])' (the repository name). Set it in the app's version resource: Tauri productName in tauri.conf.json; winres/winresource FileDescription and ProductName in build.rs; FILEDESCRIPTION/PRODUCTNAME in the .rc file; <Product>/<AssemblyTitle> in the .csproj; Electron productName."
              $fail = $true
            }
          }
          if ($fail) { exit 1 }

      - name: Pack installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          GLORIA_SETUP: ${{ inputs.gloria_setup }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Retry([string]$what, [scriptblock]$do) {
            # Network steps (npm, the WebView2 download): retry with backoff so a hiccup does not fail the release.
            foreach ($wait in 0, 5, 15, 30) {
              if ($wait) { "$what failed; retrying in ${wait}s"; Start-Sleep $wait }
              try { & $do; if ($LASTEXITCODE -eq 0 -or $null -eq $LASTEXITCODE) { return } } catch { "$what`: $_" }
            }
            throw "$what failed"
          }
          if (-not $env:GLORIA_SETUP) {
            Invoke-Retry 'npm view' { $script:gs = (npm view gloria-setup version) }
            $env:GLORIA_SETUP = "$gs".Trim()
          }
          $dir = Join-Path $env:RUNNER_TEMP 'gloria-setup'
          Invoke-Retry "npm install gloria-setup@$env:GLORIA_SETUP" { npm install --no-save --no-audit --no-fund --prefix $dir "gloria-setup@$env:GLORIA_SETUP" }
          $packArgs = @('--app', 'stage', '--manifest', 'gloria.toml', '--version', $env:VERSION, '--out', 'dist')
          if (Select-String -Path gloria.toml -Pattern '^\s*needs_webview2\s*=\s*true' -Quiet) {
            # Bundled into the installer so nothing is downloaded at install time.
            New-Item -ItemType Directory -Force vendor | Out-Null
            Invoke-Retry 'WebView2 bootstrapper download' { $global:LASTEXITCODE = 0; Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile vendor/MicrosoftEdgeWebview2Setup.exe }
            $sig = Get-AuthenticodeSignature vendor/MicrosoftEdgeWebview2Setup.exe
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw "WebView2 bootstrapper signature check failed: $($sig.Status)" }
            $packArgs += @('--webview2-bootstrapper', 'vendor/MicrosoftEdgeWebview2Setup.exe')
          }
          "Packing with gloria-setup $env:GLORIA_SETUP"
          node (Join-Path $dir 'node_modules/gloria-setup/cli.cjs') @packArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer (silent dry run)
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist -Filter '*_x64-setup.exe')
          if ($setup.Count -ne 1) { throw "expected one setup in dist, found $($setup.Count)" }
          $p = Start-Process -FilePath $setup[0].FullName -ArgumentList '/S --dry-run' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "dry run exited $($p.ExitCode)" }
          "$($setup[0].Name) dry run OK"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: dist/*_x64-setup.exe
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: pack
    # Runs after pack, or right away when there is nothing to pack (pack skipped).
    if: ${{ !cancelled() && !failure() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.installer && 'release-files' || inputs.artifact }}
          path: dist

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
          INSTALLER: ${{ inputs.installer }}
          GLORIA_SETUP: ${{ inputs.gloria_setup }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          shopt -s nullglob
          FILES=(dist/*)
          if [[ ${#FILES[@]} -eq 0 ]]; then echo "::error::nothing to publish"; exit 1; fi
          (cd dist && sha256sum -- * > ../SHA256SUMS.txt) && mv SHA256SUMS.txt dist/ && cat dist/SHA256SUMS.txt

          NOTES="Release $TAG."
          if [[ "$INSTALLER" == "true" ]]; then
            NOTES="Windows installer built with [GloriaSetup](https://github.com/projectGloria/GloriaSetup) $GLORIA_SETUP."
          fi

          # Reuse a draft left by a failed run; never overwrite a published release.
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [[ "$IS_DRAFT" == "false" ]]; then
            echo "::error::Release $TAG is already published; bump the version to release again."
            exit 1
          elif [[ "$IS_DRAFT" == "true" ]]; then
            echo "Reusing draft release $TAG"
            gh release edit "$TAG" --target "$TARGET_SHA" --notes "$NOTES"
            # Files a failed run uploaded may not be built this time; start from an empty draft so SHA256SUMS.txt
            # covers everything in the release.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r a; do
              [[ -n "$a" ]] && gh release delete-asset "$TAG" "$a" --yes
            done
          else
            ARGS=(release create "$TAG" --draft --target "$TARGET_SHA" --title "$TAG" --notes "$NOTES")
            if [[ "$VERSION" == *-* ]]; then ARGS+=(--prerelease); fi
            gh "${ARGS[@]}"
          fi

          gh release upload "$TAG" dist/* --clobber

          mkdir -p verify
          gh release download "$TAG" --dir verify --clobber
          (cd verify && sha256sum --check SHA256SUMS.txt)

          gh release edit "$TAG" --draft=false
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG"
